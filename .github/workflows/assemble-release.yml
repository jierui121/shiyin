name: Publish Windows package
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 合并并校验 Windows 下载包
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, tempfile, zipfile
          from pathlib import Path

          repo = os.environ["GH_REPO"]
          staging_id = 425074069
          expected_size = 552517296
          expected_sha = "674d85d9e13186926ace40cbe88b1ed2424aa254b7432be12f3b41dd5c7767ad"
          name = "Shiyin-Windows-x64.zip"

          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/{path}"]))

          assets = api(f"releases/{staging_id}/assets?per_page=100")
          parts = {asset["name"]: asset for asset in assets}
          with tempfile.TemporaryDirectory() as temp:
              archive = Path(temp) / name
              with archive.open("wb") as output:
                  for index in range(1, 28):
                      part = parts[f"{name}.part{index:03d}"]
                      assert part["state"] == "uploaded"
                      print(f"下载分段 {index}/27", flush=True)
                      subprocess.run(["gh", "api", f"repos/{repo}/releases/assets/{part['id']}", "-H", "Accept: application/octet-stream"], stdout=output, check=True)
              assert archive.stat().st_size == expected_size
              with archive.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              assert digest == expected_sha, digest
              with zipfile.ZipFile(archive) as package:
                  assert package.testzip() is None
              print("文件大小、SHA256 与 ZIP 完整性校验通过", flush=True)
              target = api("releases/tags/v1.3")
              existing = next((a for a in target["assets"] if a["name"] == name), None)
              if existing:
                  assert existing["state"] == "uploaded" and existing["size"] == expected_size and existing["digest"] == "sha256:" + expected_sha
              else:
                  subprocess.run(["gh", "release", "upload", "v1.3", str(archive), "--repo", repo], check=True)
              result = api("releases/tags/v1.3")
              asset = next(a for a in result["assets"] if a["name"] == name)
              assert asset["state"] == "uploaded" and asset["size"] == expected_size
              assert asset["digest"] == "sha256:" + expected_sha
              print("发布完成：" + asset["browser_download_url"], flush=True)
          PY
